# ~/.config/hypr/hyprland.conf
# SNOW Hyprland Configuration - Modern Pop-Up Redesign
# All original keybindings, variables, and imports preserved exactly.

# Source Theme Colors
source = ~/.config/hypr/theme-colors.conf

# ==========================================
# MONITORS
# ==========================================
monitor = , preferred, auto, 1

# ==========================================
# AUTOSTART
# ==========================================
exec-once = quickshell -p ~/.config/quickshell/snow
exec-once = hypridle
exec-once = hyprpaper
exec-once = wl-paste --watch cliphist store
exec-once = dunst
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# ==========================================
# INPUT
# ==========================================
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# ==========================================
# GENERAL & MODERN DECORATIONS
# ==========================================
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(6366f1ee) rgba(8b90a6aa) 45deg
    col.inactive_border = rgba(252636aa)
    layout = dwindle
}

decoration {
    rounding = 14
    
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = true
        ignore_opacity = true
    }
    
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000055)
    }
}

# ==========================================
# MODERN FLUID ANIMATIONS (Custom Beziers)
# ==========================================
animations {
    enabled = true
    
    # Modern Wayland Bezier Curves
    bezier = modernEase, 0.16, 1, 0.3, 1
    bezier = smoothPop, 0.05, 0.9, 0.1, 1.05
    bezier = snappy, 0.2, 0.8, 0.2, 1
    
    animation = windows, 1, 4, smoothPop, popin 85%
    animation = windowsOut, 1, 3, snappy, popin 90%
    animation = border, 1, 5, modernEase
    animation = fade, 1, 3, modernEase
    animation = workspaces, 1, 4, modernEase, slide
}

# ==========================================
# WINDOW RULES (Pop-up Styling & Floating)
# ==========================================
windowrulev2 = float, class:^(quickshell)$
windowrulev2 = noblur, class:^(quickshell)$ # Quickshell manages internal blurs
windowrulev2 = float, class:^(swappy)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(pwvucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, title:^(Authentication Required)$

# ==========================================
# EXACT PRESERVED KEYBINDINGS
# ==========================================
$mainMod = SUPER

# Applications
bind = $mainMod, SPACE, exec, quickshell -p ~/.config/quickshell/snow -d launcher
bind = $mainMod, A, exec, quickshell -p ~/.config/quickshell/snow -d quicksettings
bind = $mainMod, TAB, exec, quickshell -p ~/.config/quickshell/snow -d apps
bind = $mainMod, ESCAPE, exec, quickshell -p ~/.config/quickshell/snow -d power
bind = $mainMod, PERIOD, exec, quickshell -p ~/.config/quickshell/snow -d clock

# Quick Launchers
bind = $mainMod, T, exec, kitty
bind = $mainMod, B, exec, zen-browser-bin
bind = $mainMod, E, exec, nautilus
bind = $mainMod, M, exit

# Screenshots
bind = $mainMod, S, exec, bash ~/.config/snow/bin/screenshot.sh area
bind = $mainMod SHIFT, S, exec, bash ~/.config/snow/bin/screenshot.sh screen

# Volume & Brightness Keys (OSD triggers)
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && quickshell -p ~/.config/quickshell/snow -d volume
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && quickshell -p ~/.config/quickshell/snow -d volume
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && quickshell -p ~/.config/quickshell/snow -d volume
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && quickshell -p ~/.config/quickshell/snow -d brightness
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && quickshell -p ~/.config/quickshell/snow -d brightness
